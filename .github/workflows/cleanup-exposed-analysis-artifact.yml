name: Cleanup exposed analysis artifact

on:
  push:
    branches:
      - main

permissions:
  actions: write

jobs:
  delete-artifact:
    runs-on: ubuntu-24.04
    steps:
      - name: Delete the artifact containing unredacted bundled environment values
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output "$RUNNER_TEMP/delete-artifact-response.txt" \
            --write-out '%{http_code}' \
            --request DELETE \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/dvd2pe/actions-probe/actions/artifacts/14812540332")"
          if [[ "$status" != "204" && "$status" != "404" ]]; then
            cat "$RUNNER_TEMP/delete-artifact-response.txt"
            echo "Unexpected artifact deletion response: $status" >&2
            exit 1
          fi
          echo "Artifact 14812540332 deleted or already absent (HTTP $status)."
