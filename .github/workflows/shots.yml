name: DearCocoa Screenshots (emulatore, da dearcocoa-mobile)

on:
  workflow_dispatch:
  workflow_call:

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout DearCocoa (repo privato)
        uses: actions/checkout@v4
        with:
          repository: dvd2pe/dearcocoa-mobile
          token: ${{ secrets.DVD2PE_TOKEN }}

      - name: Libera spazio sul runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/local/lib/node_modules /usr/local/share/chromium || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.5"
          channel: stable
          cache: true

      - run: flutter pub get

      # APK sempre release, mai debug (regola cliente). Serve l'x86_64 per l'emulatore.
      - run: flutter build apk --release --flavor global --split-per-abi

      # Con KVM il boot scende da ~17 min (TCG) a 2-4 min. Se assente, prosegue uguale.
      - name: Abilita KVM (se disponibile)
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm || true
            ls -l /dev/kvm
          else
            echo "no /dev/kvm: boot in TCG (lento ma funziona)"
          fi

      - name: Prepara cartella screenshot
        run: mkdir -p /tmp/shots

      # Tour automatico: l'app è local-first (si avvia senza login); Timeline,
      # menu radiale AI, Community, Events, Library.
      # Lo script è il FILE scripts/demo_tour.sh nel repo dell'app:
      # android-emulator-runner esegue lo script inline RIGA PER RIGA in shell
      # separate (le variabili non sopravvivono e i blocchi if/for si rompono).
      - name: Tour app su emulatore + screencap
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          emulator-boot-timeout: 1500
          script: |
            set -x
            bash "$GITHUB_WORKSPACE/scripts/demo_tour.sh"

      - uses: actions/upload-artifact@v4
        with:
          name: dearcocoa-screenshots
          path: /tmp/shots/*.png
          retention-days: 30
