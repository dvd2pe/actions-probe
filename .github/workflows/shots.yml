name: DearCocoa Screenshots (emulatore, da dearcocoa-mobile)

on:
  workflow_dispatch:
  workflow_call:

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout DearCocoa (repo privato)
        uses: actions/checkout@v4
        with:
          repository: dvd2pe/dearcocoa-mobile
          token: ${{ secrets.DVD2PE_TOKEN }}

      - name: Libera spazio sul runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/local/lib/node_modules /usr/local/share/chromium || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.5"
          channel: stable
          cache: true

      # Firma: keystore release DECODIFICATO dai secrets (mai committato).
      # Senza questo l'APK release è UNSIGNED e adb install fallisce con
      # INSTALL_PARSE_FAILED_NO_CERTIFICATES (bug della run del 19/11).
      - name: Prepara firma release dai secrets
        env:
          DC_KEYSTORE_B64: ${{ secrets.DC_KEYSTORE_B64 }}
          DC_KEYSTORE_PASS: ${{ secrets.DC_KEYSTORE_PASS }}
          DC_KEY_ALIAS: ${{ secrets.DC_KEY_ALIAS }}
        run: |
          set -e
          mkdir -p tools
          echo "$DC_KEYSTORE_B64" | base64 -d > tools/dearcocoa-release.jks
          test -s tools/dearcocoa-release.jks || { echo "keystore vuoto" >&2; exit 1; }
          cat > android/key-global.properties <<EOF
          keyAlias=$DC_KEY_ALIAS
          keyPassword=$DC_KEYSTORE_PASS
          storeFile=../../tools/dearcocoa-release.jks
          storePassword=$DC_KEYSTORE_PASS
          EOF
          echo "firma release OK (alias $DC_KEY_ALIAS)"

      - run: flutter pub get

      # APK sempre release, mai debug (regola cliente). Serve l'x86_64 per l'emulatore.
      - run: flutter build apk --release --flavor global --split-per-abi

      # Con KVM il boot scende da ~17 min (TCG) a 2-4 min. Se assente, prosegue uguale.
      - name: Abilita KVM (se disponibile)
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm || true
            ls -l /dev/kvm
          else
            echo "no /dev/kvm: boot in TCG (lento ma funziona)"
          fi

      - name: Prepara cartella screenshot
        run: mkdir -p /tmp/shots

      # Tour automatico: l'app è local-first (si avvia senza login); Timeline,
      # menu radiale AI, Community, Events, Library.
      # Lo script è il FILE scripts/demo_tour.sh nel repo dell'app:
      # android-emulator-runner esegue lo script inline RIGA PER RIGA in shell
      # separate (le variabili non sopravvivono e i blocchi if/for si rompono).
      # Profilo device reale: senza --device l'AVD esce 320x640 (inutilizzabile).
      # pixel_7 = 1080x2400 @ 420dpi.
      - name: Tour app su emulatore + screencap
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          avd-manager-args: "--device pixel_7"
          emulator-boot-timeout: 1500
          script: |
            set -x
            bash "$GITHUB_WORKSPACE/scripts/demo_tour.sh"

      - uses: actions/upload-artifact@v4
        with:
          name: dearcocoa-screenshots
          path: /tmp/shots/*.png
          retention-days: 30
