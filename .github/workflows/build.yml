name: Build DearCocoa APK (dal repo privato)

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout DearCocoa (repo privato)
        uses: actions/checkout@v4
        with:
          repository: dvd2pe/dearcocoa
          token: ${{ secrets.DVD2PE_TOKEN }}

      # La build (SDK + pub cache + gradle + output) sfora il disco libero
      # del runner standard: si liberano ~20 GB.
      - name: Libera spazio sul runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/local/lib/node_modules /usr/local/share/chromium || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.5"
          channel: stable
          cache: true

      # Il plugin sherpa_onnx compila codice nativo (:app:configureCMakeRelease):
      # serve CMake 3.22.1. Il runner non raggiunge dl.google.com e ha cmake
      # 3.31.5/4.1.2 ma non il 3.22.1: tarball Kitware + cmake.dir.
      - name: Installa CMake 3.22.1 (tarball Kitware)
        run: |
          if [ ! -x "$HOME/cmake-3.22.1-linux-x86_64/bin/cmake" ]; then
            curl -sL -o /tmp/cmake.tar.gz https://github.com/Kitware/CMake/releases/download/v3.22.1/cmake-3.22.1-linux-x86_64.tar.gz
            tar -xzf /tmp/cmake.tar.gz -C "$HOME"
          fi
          echo "$HOME/cmake-3.22.1-linux-x86_64/bin" >> "$GITHUB_PATH"
          echo "cmake.dir=$HOME/cmake-3.22.1-linux-x86_64" >> android/gradle.properties
          "$HOME/cmake-3.22.1-linux-x86_64/bin/cmake" --version

      # build.gradle.kts: key-global.properties si legge da rootProject (= app/android/)
      # e storeFile viene risolto rispetto alla dir del modulo :app -> percorso assoluto.
      - name: Keystore demo (solo per APK di test, mai per lo store)
        run: |
          KS="$PWD/android/app/demo.keystore"
          if [ ! -f "$KS" ]; then
            keytool -genkeypair -v -keystore "$KS" -alias dearcocoa -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass dearcocoa2026 -keypass dearcocoa2026 \
              -dname "CN=DearCocoa Demo, O=DearCocoa, C=IT"
          fi
          cat > android/key-global.properties <<EOF
          keyAlias=dearcocoa
          keyPassword=dearcocoa2026
          storeFile=$KS
          storePassword=dearcocoa2026
          EOF

      - run: flutter pub get
      - run: flutter build apk --release --flavor global

      - name: Ridenomina l'artefatto
        run: |
          APK=$(ls build/app/outputs/flutter-apk/*.apk 2>/dev/null | head -1)
          [ -z "$APK" ] && APK=$(find build/app/outputs -name "*.apk" -not -path "*intermediates*" | head -1)
          echo "APK trovato: $APK"
          cp "$APK" dearcocoa-demo.apk
          ls -lh dearcocoa-demo.apk

      - uses: actions/upload-artifact@v4
        with:
          name: dearcocoa-demo-apk
          path: app/dearcocoa-demo.apk
          retention-days: 30

      # Release v1.0.39-demo sul repo privato dearcocoa (non consuma minuti Actions)
      - name: Crea release su dvd2pe/dearcocoa con l'APK
        env:
          DVD2PE_TOKEN: ${{ secrets.DVD2PE_TOKEN }}
        run: |
          set -e
          API="https://api.github.com/repos/dvd2pe/dearcocoa"
          AUTH="Authorization: token $DVD2PE_TOKEN"
          # release esistente?
          REL=$(curl -s -H "$AUTH" "$API/releases/tags/v1.0.39-demo")
          RELID=$(echo "$REL" | python3 -c "import json,sys;d=json.load(sys.stdin);print(d.get('id',''))")
          if [ -z "$RELID" ]; then
            REL=$(curl -s -X POST -H "$AUTH" -H "Accept: application/vnd.github+json" "$API/releases" -d "{
              \"tag_name\":\"v1.0.39-demo\",\"target_commitish\":\"main\",
              \"name\":\"DearCocoa v1.0.39 (demo APK)\",
              \"body\":\"APK demo firmato con keystore demo (flavor global, appId app.dearcocoa.mobile, label DearCocoa).\\nBuild Flutter 3.35.5 / JDK 21 / AGP 8.11 / NDK 27.3 (ndkVersion allineato: 27.0.12077973 non è più scaricabile).\\nKeystore demo (password dearcocoa2026) — mai per lo store.\\nInstallazione: abilitare le origini sconosciute sul dispositivo.\"}")
            RELID=$(echo "$REL" | python3 -c "import json,sys;print(json.load(sys.stdin).get('id',''))")
          fi
          echo "release id: $RELID"
          UURL=$(curl -s -H "$AUTH" "$API/releases/$RELID" | python3 -c "import json,sys;print(json.load(sys.stdin)['upload_url'].split('{')[0])")
          curl -s -o /dev/null -w "upload asset HTTP %{http_code}\n" -X POST -H "$AUTH" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary "@dearcocoa-demo.apk" "$UURL?name=dearcocoa-demo.apk"
          curl -s -H "$AUTH" "$API/releases/$RELID" | python3 -c "import json,sys;d=json.load(sys.stdin);print('release url:', d.get('html_url'))"
