name: Build DearCocoa APK (dal repo privato)

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout DearCocoa (repo privato)
        uses: actions/checkout@v4
        with:
          repository: dvd2pe/dearcocoa
          token: ${{ secrets.DVD2PE_TOKEN }}

      # La build (SDK + pub cache + gradle + output) sfora il disco libero
      # del runner standard: si liberano ~20 GB.
      - name: Libera spazio sul runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/local/lib/node_modules /usr/local/share/chromium || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.5"
          channel: stable
          cache: true

      # M12: sherpa_onnx rimosso (niente più build nativa CMake/NDK).
      # Firma: keystore release ufficiale committato nel repo privato
      # (app/tools/dearcocoa-release.jks + app/android/key-global.properties).
      - name: Verifica firma release presente
        run: |
          test -f tools/dearcocoa-release.jks || { echo "keystore mancante" >&2; exit 1; }
          test -f android/key-global.properties || { echo "key properties mancanti" >&2; exit 1; }
          echo "firma release OK (alias $(grep keyAlias android/key-global.properties | cut -d= -f2))"

      - run: flutter pub get

      # APK sempre release, mai debug (regola cliente).
      # --split-per-abi: 1 APK per architettura (il plugin Flutter gestisce lo
      # split; un blocco `splits` custom confliggerebbe con gli abiFilters).
      - run: flutter build apk --release --flavor global --split-per-abi

      - name: Ridenomina i 3 APK per-ABI
        run: |
          OUT=build/app/outputs/apk/global/release
          ls -lh $OUT
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            SRC="$OUT/app-global-$ABI-release.apk"
            [ -f "$SRC" ] || SRC=$(find build/app/outputs -name "*$ABI*.apk" -not -path "*intermediates*" | head -1)
            [ -f "$SRC" ] || { echo "APK $ABI non trovato" >&2; exit 1; }
            cp "$SRC" "dearcocoa-0.3.1-$ABI.apk"
          done
          ls -lh dearcocoa-0.3.1-*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: dearcocoa-0.3.1-apks
          path: app/dearcocoa-0.3.1-*.apk
          retention-days: 30

      # Release v0.3.1-dearcocoa sul repo privato (la creazione release non
      # consuma minuti Actions).
      - name: Crea release v0.3.1-dearcocoa con i 3 APK
        env:
          DVD2PE_TOKEN: ${{ secrets.DVD2PE_TOKEN }}
        run: |
          set -e
          API="https://api.github.com/repos/dvd2pe/dearcocoa"
          AUTH="Authorization: token $DVD2PE_TOKEN"
          TAG="v0.3.1-dearcocoa"
          REL=$(curl -s -H "$AUTH" "$API/releases/tags/$TAG")
          RELID=$(echo "$REL" | python3 -c "import json,sys;d=json.load(sys.stdin);print(d.get('id',''))")
          if [ -z "$RELID" ]; then
            REL=$(curl -s -X POST -H "$AUTH" -H "Accept: application/vnd.github+json" "$API/releases" -d "{
              \"tag_name\":\"$TAG\",\"target_commitish\":\"main\",
              \"name\":\"DearCocoa v0.3.1 — fix UX onboarding, AI opzionale, niente logo\",
              \"body\":\"Fix release v0.3.1 (report utente da telefono reale).\\n\\n- Niente piu' muro di benvenuto in loop: onboarding completo per qualsiasi utente locale; username di fallback dall'email se il profilo Supabase non ha username.\\n- AI/LLM completamente opzionale: niente popup 'LLM configuration is invalid' o dialog di configurazione mancante; le funzionalita' AI restano dormienti finche' non si aggiunge una chiave in Settings.\\n- Community ed Events: senza sessione mostrano il picker demo one-tap invece dell'errore di rete.\\n- Tutorial: i testi non hanno piu' la sottolineatura gialla, lo scrim non blocca piu' i tap (guida, non ostacolo).\\n- Riferimenti 'Memex' visibili rimossi (card intro, config AI, chat, documento, auth).\\n- Logo rimosso dal splash di avvio.\\n- Liste nelle note: digita '- elemento' o '- [ ] task' nel contenuto — renderizzate nella card di dettaglio.\\n\\nFirma: keystore release ufficiale. Versione 0.3.1+126.\"}")
            RELID=$(echo "$REL" | python3 -c "import json,sys;print(json.load(sys.stdin).get('id',''))")
          fi
          echo "release id: $RELID"
          UURL=$(curl -s -H "$AUTH" "$API/releases/$RELID" | python3 -c "import json,sys;print(json.load(sys.stdin)['upload_url'].split('{')[0])")
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            APK="dearcocoa-0.3.1-$ABI.apk"
            curl -s -o /dev/null -w "upload $APK HTTP %{http_code}\n" -X POST -H "$AUTH" \
              -H "Content-Type: application/vnd.android.package-archive" \
              --data-binary "@$APK" "$UURL?name=$APK"
          done
          curl -s -H "$AUTH" "$API/releases/$RELID" | python3 -c "import json,sys;d=json.load(sys.stdin);print('release url:', d.get('html_url'));print('assets:', [a['name'] for a in d.get('assets',[])])"
