name: Build DearCocoa APK (repo pubblico + keystore via secrets)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versione APK (es. 0.3.2)'
        required: false
        default: '0.3.2'
      notes:
        description: 'Note di release (multilinea possibile)'
        required: false
        default: 'Release DearCocoa'
  workflow_call:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      # Checkout del repo pubblico di lavoro: unica fonte di verita'.
      # Niente piu' mirror da sincronizzare.
      - name: Checkout DearCocoa (pubblico)
        uses: actions/checkout@v4
        with:
          repository: dvd2pe/dearcocoa-mobile
          ref: main

      # La build (SDK + pub cache + gradle + output) sfora il disco libero
      # del runner standard: si liberano ~20 GB.
      - name: Libera spazio sul runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/local/lib/node_modules /usr/local/share/chromium || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.5"
          channel: stable
          cache: true

      # Firma: keystore release DECODIFICATO dai secrets (mai committato).
      # Il gradle legge android/key-global.properties con storeFile
      # ../../tools/dearcocoa-release.jks (relativo a app/android/).
      - name: Prepara firma release dai secrets
        env:
          DC_KEYSTORE_B64: ${{ secrets.DC_KEYSTORE_B64 }}
          DC_KEYSTORE_PASS: ${{ secrets.DC_KEYSTORE_PASS }}
          DC_KEY_ALIAS: ${{ secrets.DC_KEY_ALIAS }}
        run: |
          set -e
          mkdir -p tools
          echo "$DC_KEYSTORE_B64" | base64 -d > tools/dearcocoa-release.jks
          test -s tools/dearcocoa-release.jks || { echo "keystore vuoto" >&2; exit 1; }
          cat > android/key-global.properties <<EOF
          keyAlias=$DC_KEY_ALIAS
          keyPassword=$DC_KEYSTORE_PASS
          storeFile=../../tools/dearcocoa-release.jks
          storePassword=$DC_KEYSTORE_PASS
          EOF
          echo "firma release OK (alias $DC_KEY_ALIAS)"

      - run: flutter pub get

      # APK sempre release, mai debug (regola cliente).
      - run: flutter build apk --release --flavor global --split-per-abi

      - name: Ridenomina i 3 APK per-ABI
        env:
          VERSION: ${{ github.event.inputs.version || '0.3.2' }}
        run: |
          OUT=build/app/outputs/apk/global/release
          ls -lh $OUT
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            SRC="$OUT/app-global-$ABI-release.apk"
            [ -f "$SRC" ] || SRC=$(find build/app/outputs -name "*$ABI*.apk" -not -path "*intermediates*" | head -1)
            [ -f "$SRC" ] || { echo "APK $ABI non trovato" >&2; exit 1; }
            cp "$SRC" "dearcocoa-${VERSION}-${ABI}.apk"
          done
          ls -lh dearcocoa-${VERSION}-*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: dearcocoa-apks
          path: app/dearcocoa-*-*.apk
          retention-days: 30

      # Release sul repo pubblico dearcocoa-mobile (la creazione release
      # non consuma minuti Actions).
      - name: Crea release con i 3 APK
        env:
          DVD2PE_TOKEN: ${{ secrets.DVD2PE_TOKEN }}
          VERSION: ${{ github.event.inputs.version || '0.3.2' }}
          NOTES: ${{ github.event.inputs.notes || 'Release DearCocoa' }}
        run: |
          set -e
          API="https://api.github.com/repos/dvd2pe/dearcocoa-mobile"
          AUTH="Authorization: token $DVD2PE_TOKEN"
          TAG="v${VERSION}-dearcocoa"
          BODY=$(echo "$NOTES" | python3 -c "import json,sys;print(json.dumps(sys.stdin.read()))")
          REL=$(curl -s -H "$AUTH" "$API/releases/tags/$TAG")
          RELID=$(echo "$REL" | python3 -c "import json,sys;d=json.load(sys.stdin);print(d.get('id',''))")
          if [ -z "$RELID" ]; then
            REL=$(curl -s -X POST -H "$AUTH" -H "Accept: application/vnd.github+json" "$API/releases" -d "{
              \"tag_name\":\"$TAG\",\"target_commitish\":\"main\",
              \"name\":\"DearCocoa v${VERSION}\",
              \"body\":$BODY}")
            RELID=$(echo "$REL" | python3 -c "import json,sys;print(json.load(sys.stdin).get('id',''))")
          fi
          echo "release id: $RELID"
          UURL=$(curl -s -H "$AUTH" "$API/releases/$RELID" | python3 -c "import json,sys;print(json.load(sys.stdin)['upload_url'].split('{')[0])")
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            APK="dearcocoa-${VERSION}-${ABI}.apk"
            curl -s -o /dev/null -w "upload $APK HTTP %{http_code}\n" -X POST -H "$AUTH" \
              -H "Content-Type: application/vnd.android.package-archive" \
              --data-binary "@$APK" "$UURL?name=$APK"
          done
          curl -s -H "$AUTH" "$API/releases/$RELID" | python3 -c "import json,sys;d=json.load(sys.stdin);print('release url:', d.get('html_url'));print('assets:', [a['name'] for a in d.get('assets',[])])"
