name: REA Android APK analysis
# Default target: Yaya Middle East 5.6.2 (com.yaya.portal), distributed as XAPK.
# Follow-up static inventory includes Flutter config and selected Android method bodies.
# Final pass includes APK signature validation and bundled environment config capture.
# Environment variables are retained as names only; secret values are redacted.

on:
  push:
    branches:
      - main
      - rea-apk-lab
      - rea-yaya-blutter-deep-analysis
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      apk_url:
        description: Direct APK or XAPK download URL
        required: true
        type: string
        default: "https://d.apkpure.net/b/XAPK/com.yaya.portal?version=latest"
      expected_sha256:
        description: Expected SHA-256 of the downloaded APK/XAPK bundle
        required: true
        type: string
        default: "2b707fe58aab7b3c8ba1c53520d3496480d7ee14d75d59393359f633adbe2cd2"
      package_name:
        description: Expected Android application ID
        required: true
        type: string
        default: "com.yaya.portal"

permissions:
  contents: read

jobs:
  android-analysis:
    name: Analyze Android package with REA
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Prepare isolated report directory
        id: reports
        shell: bash
        run: |
          directory="$(mktemp -d "${RUNNER_TEMP}/rea-android.XXXXXX")"
          printf 'directory=%s\n' "$directory" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Check Linux and Java prerequisites
        shell: bash
        env:
          REPORT_DIR: ${{ steps.reports.outputs.directory }}
        run: |
          set -euo pipefail
          missing=()
          command -v ps >/dev/null 2>&1 || missing+=(procps)
          command -v apktool >/dev/null 2>&1 || missing+=(apktool)
          if (( ${#missing[@]} )); then
            sudo apt-get update -qq
            sudo apt-get install --yes --no-install-recommends "${missing[@]}"
          fi
          node --version
          npm --version
          java --version
          java --list-modules | grep '^jdk.compiler@'
          apktool --version | tee "$REPORT_DIR/apktool-version.txt"
          command -v apktool > "$REPORT_DIR/apktool-command.txt"


      - name: Install pinned REA CLI
        shell: bash
        run: |
          npm install --prefix "${RUNNER_TEMP}/rea-tool" --no-audit --no-fund --ignore-scripts --save-exact rea-agents@6.10.1
          echo "${RUNNER_TEMP}/rea-tool/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Record REA command catalog
        if: ${{ success() }}
        shell: bash
        env:
          REPORT_DIR: ${{ steps.reports.outputs.directory }}
        run: |
          set +e
          rea --version --json > "$REPORT_DIR/rea-version.json" 2> "$REPORT_DIR/rea-version.stderr"
          rea --help > "$REPORT_DIR/rea-cli-help.txt" 2> "$REPORT_DIR/rea-cli-help.stderr"
          for command in decode-android-resources inspect-android-jni-bindings identify-flutter-build inspect-artifact project-android-application-graph build-reconstruction-obligation-ledger trace-application-feature; do
            rea "$command" --help > "$REPORT_DIR/rea-help-$command.txt" 2> "$REPORT_DIR/rea-help-$command.stderr"
            printf '%s\n' "$?" > "$REPORT_DIR/rea-help-$command.exit-code.txt"
          done
          for command in project-android-application-graph build-reconstruction-obligation-ledger trace-application-feature; do
            rea "$command" --schema > "$REPORT_DIR/rea-schema-$command.json" 2> "$REPORT_DIR/rea-schema-$command.stderr"
            printf '%s\n' "$?" > "$REPORT_DIR/rea-schema-$command.exit-code.txt"
          done
          exit 0

      - name: Download and verify JADX and target APK/XAPK
        shell: bash
        env:
          REPORT_DIR: ${{ steps.reports.outputs.directory }}
          APK_URL: ${{ github.event.inputs.apk_url || 'https://d.apkpure.net/b/XAPK/com.yaya.portal?version=latest' }}
          EXPECTED_SHA256: ${{ github.event.inputs.expected_sha256 || '2b707fe58aab7b3c8ba1c53520d3496480d7ee14d75d59393359f633adbe2cd2' }}
          EXPECTED_PACKAGE: ${{ github.event.inputs.package_name || 'com.yaya.portal' }}
        run: |
          set -euo pipefail
          android_dir="${RUNNER_TEMP}/rea-android"
          mkdir -p "$android_dir"
          jar="$android_dir/jadx-headless-mcp-0.7.1-all.jar"
          bundle="$android_dir/target-package.xapk"

          curl --fail --location --retry 3 --silent --show-error \
            "https://github.com/1013503897/jadx-headless-mcp/releases/download/v0.7.1/jadx-headless-mcp-0.7.1-all.jar" \
            --output "$jar"
          printf '%s  %s\n' \
            '6e5eacf500b64292bfb73c49797c1958f6ee44646e43e868039ae7feb573ff75' \
            "$jar" | sha256sum --check

          curl --fail --location --retry 3 --silent --show-error \
            --user-agent "Mozilla/5.0 (compatible; REA-Android-Analyzer/1.0)" \
            "$APK_URL" --output "$bundle"
          printf '%s  %s\n' "$EXPECTED_SHA256" "$bundle" | sha256sum --check
          sha256sum "$bundle" > "$REPORT_DIR/apk-bundle.sha256"
          printf 'APK_SOURCE=%s\n' "$APK_URL" > "$REPORT_DIR/app-source.txt"
          printf 'EXPECTED_PACKAGE=%s\n' "$EXPECTED_PACKAGE" >> "$REPORT_DIR/app-source.txt"
          printf 'REA_VERSION=6.10.1\n' >> "$REPORT_DIR/app-source.txt"
          printf 'JADX_VERSION=0.7.1\n' >> "$REPORT_DIR/app-source.txt"

          extract_dir="$android_dir/extracted"
          mkdir -p "$extract_dir"
          if unzip -tq "$bundle" >/dev/null 2>&1; then
            unzip -q "$bundle" -d "$extract_dir"
            mapfile -t apk_files < <(find "$extract_dir" -type f -iname '*.apk' | sort)
            if [[ "${#apk_files[@]}" -eq 0 ]]; then
              echo "The downloaded XAPK contains no APK files." >&2
              exit 1
            fi
            if [[ -f "$extract_dir/base.apk" ]]; then
              apk="$extract_dir/base.apk"
            else
              apk="${apk_files[0]}"
            fi
            printf '%s\n' "${apk_files[@]}" > "$REPORT_DIR/extracted-apk-files.txt"
            find "$extract_dir" -type f -iname '*.apk' -print0 | sort -z | xargs -0 sha256sum > "$REPORT_DIR/extracted-apk-sha256.txt"
          else
            apk="$android_dir/target.apk"
            cp "$bundle" "$apk"
          fi

          printf 'REA_JADX_MCP_JAR=%s\n' "$jar" >> "$GITHUB_ENV"
          printf 'APK_PATH=%s\n' "$apk" >> "$GITHUB_ENV"
          printf 'EXPECTED_PACKAGE=%s\n' "$EXPECTED_PACKAGE" >> "$GITHUB_ENV"
          printf 'APK_SELECTED=%s\n' "$apk" >> "$REPORT_DIR/app-source.txt"

      - name: Inspect APK with REA
        id: analyze
        shell: bash
        env:
          REPORT_DIR: ${{ steps.reports.outputs.directory }}
        run: |
          set +e
          rea inspect-android-package "$APK_PATH" --format json --full-output \
            > "$REPORT_DIR/analysis.json" 2> "$REPORT_DIR/analysis.stderr"
          status=$?
          set -e
          printf '%s\n' "$status" > "$REPORT_DIR/exit-code.txt"
          if [[ "$status" -ne 0 ]]; then
            exit "$status"
          fi
          jq -e --arg expected "$EXPECTED_PACKAGE" '
            .data.raw_result.calls[]
            | select(.operation == "get_app_info")
            | .response.content[]
            | select(.type == "text")
            | .text
            | fromjson
            | select(.package == $expected)
          ' "$REPORT_DIR/analysis.json" >/dev/null

      - name: Inspect APK signature and certificate identity
        if: ${{ success() }}
        shell: bash
        env:
          REPORT_DIR: ${{ steps.reports.outputs.directory }}
        run: |
          set +e
          rea inspect-apk-signature "$APK_PATH" --format json --full-output \
            > "$REPORT_DIR/signature.json" 2> "$REPORT_DIR/signature.stderr"
          status=$?
          set -e
          printf '%s\n' "$status" > "$REPORT_DIR/signature.exit-code.txt"
          exit "$status"

      - name: Inventory app classes and inspect Android entry points
        if: ${{ success() }}
        shell: bash
        env:
          REPORT_DIR: ${{ steps.reports.outputs.directory }}
        run: |
          set +e
          for query in "com.yaya.portal" "com.pairip"; do
            slug="$(printf '%s' "$query" | tr '. ' '__')"
            rea search-android-classes "$APK_PATH" "$query" --format json --full-output \
              > "$REPORT_DIR/classes-$slug.json" 2> "$REPORT_DIR/classes-$slug.stderr"
            printf '%s\n' "$?" > "$REPORT_DIR/classes-$slug.exit-code.txt"
          done

          for class_name in "com.yaya.portal.MainActivity" "com.pairip.application.Application"; do
            slug="$(printf '%s' "$class_name" | tr '. ' '__')"
            rea inspect-android-class "$APK_PATH" "$class_name" --format json --full-output \
              > "$REPORT_DIR/class-$slug.json" 2> "$REPORT_DIR/class-$slug.stderr"
            printf '%s\n' "$?" > "$REPORT_DIR/class-$slug.exit-code.txt"
          done
          for class_name in "com.pairip.licensecheck.LicenseClient"; do
            slug="$(printf '%s' "$class_name" | tr '. ' '__')"
            rea inspect-android-class "$APK_PATH" "$class_name" --format json --full-output \
              > "$REPORT_DIR/class-$slug.json" 2> "$REPORT_DIR/class-$slug.stderr"
            printf '%s\n' "$?" > "$REPORT_DIR/class-$slug.exit-code.txt"
          done

          for selector in "com.yaya.portal.MainActivity|onCreate" "com.pairip.application.Application|attachBaseContext" "com.pairip.licensecheck.LicenseClient|checkLicense" "com.pairip.licensecheck.LicenseClient|performLocalInstallerCheck" "com.pairip.licensecheck.LicenseClient|processResponse"; do
            class_name="${selector%%|*}"
            method_name="${selector#*|}"
            slug="$(printf '%s_%s' "$class_name" "$method_name" | tr '. ' '__')"
            rea inspect-android-method "$APK_PATH" "$class_name" "$method_name" --format json --full-output \
              > "$REPORT_DIR/method-$slug.json" 2> "$REPORT_DIR/method-$slug.stderr"
            printf '%s\n' "$?" > "$REPORT_DIR/method-$slug.exit-code.txt"
          done
          exit 0

      - name: Capture Android resources, JNI bindings and Flutter build identity
        if: ${{ success() }}
        shell: bash
        env:
          REPORT_DIR: ${{ steps.reports.outputs.directory }}
        run: |
          set +e
          export REA_APKTOOL_COMMAND="$(command -v apktool)"

          rea decode-android-resources "$APK_PATH" --format json --full-output \
            > "$REPORT_DIR/android-resources.json" 2> "$REPORT_DIR/android-resources.stderr"
          printf '%s\n' "$?" > "$REPORT_DIR/android-resources.exit-code.txt"

          rea inspect-android-jni-bindings "$APK_PATH" --format json --full-output \
            > "$REPORT_DIR/android-jni-bindings.json" 2> "$REPORT_DIR/android-jni-bindings.stderr"
          printf '%s\n' "$?" > "$REPORT_DIR/android-jni-bindings.exit-code.txt"

          rea identify-flutter-build "$APK_PATH" --format json --full-output \
            > "$REPORT_DIR/flutter-build-identity.json" 2> "$REPORT_DIR/flutter-build-identity.stderr"
          printf '%s\n' "$?" > "$REPORT_DIR/flutter-build-identity.exit-code.txt"

          # The XAPK stores libapp.so and the Flutter engine in config.arm64_v8a.apk.
          # Build a temporary analysis-only APK containing base DEX/manifest plus ABI native libraries.
          abi_split="${RUNNER_TEMP}/rea-android/extracted/config.arm64_v8a.apk"
          merged_apk="${RUNNER_TEMP}/rea-android/yaya-merged-arm64-analysis.apk"
          if [[ -f "$abi_split" ]]; then
            python3 - "$APK_PATH" "$abi_split" "$merged_apk" <<'PY'
          import pathlib, sys, zipfile
          base, split, output = map(pathlib.Path, sys.argv[1:])
          seen = set()
          with zipfile.ZipFile(output, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=6) as target:
              with zipfile.ZipFile(base) as source:
                  for info in source.infolist():
                      if info.is_dir():
                          continue
                      target.writestr(info, source.read(info.filename))
                      seen.add(info.filename)
              with zipfile.ZipFile(split) as source:
                  for info in source.infolist():
                      if info.is_dir() or not info.filename.startswith("lib/arm64-v8a/"):
                          continue
                      if info.filename in seen:
                          continue
                      target.writestr(info, source.read(info.filename))
                      seen.add(info.filename)
          print(f"Created temporary merged analysis APK with {len(seen)} entries.")
          PY
            if [[ -f "$merged_apk" ]]; then
              sha256sum "$merged_apk" > "$REPORT_DIR/merged-abi-analysis.sha256"
              rea inspect-android-jni-bindings "$merged_apk" --format json --full-output \
                > "$REPORT_DIR/android-jni-bindings-merged.json" 2> "$REPORT_DIR/android-jni-bindings-merged.stderr"
              printf '%s\n' "$?" > "$REPORT_DIR/android-jni-bindings-merged.exit-code.txt"

              rea identify-flutter-build "$merged_apk" --format json --full-output \
                > "$REPORT_DIR/flutter-build-identity-merged.json" 2> "$REPORT_DIR/flutter-build-identity-merged.stderr"
              printf '%s\n' "$?" > "$REPORT_DIR/flutter-build-identity-merged.exit-code.txt"

              rea inspect-artifact "$merged_apk" --detail summary \
                --evidence_output "$REPORT_DIR/merged-android-inventory-evidence.json" --json \
                > "$REPORT_DIR/merged-android-inventory-summary.json" 2> "$REPORT_DIR/merged-android-inventory.stderr"
              inventory_status="$?"
              printf '%s\n' "$inventory_status" > "$REPORT_DIR/merged-android-inventory.exit-code.txt"
              if [[ "$inventory_status" -ne 0 || ! -s "$REPORT_DIR/merged-android-inventory-evidence.json" ]]; then
                echo "REA merged Android inventory failed (exit $inventory_status)." >&2
                cat "$REPORT_DIR/merged-android-inventory.stderr" >&2 || true
                exit 1
              fi

              python3 - "$REPORT_DIR/merged-android-inventory-evidence.json" "$REPORT_DIR/android-graph-request.json" <<'PY'
          import json, pathlib, sys
          evidence = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          records = evidence.get("records")
          if not isinstance(records, list) or not records:
              raise SystemExit("REA evidence bundle contains no evidence records.")
          evidence_ids = [record.get("evidence_id") for record in records
                          if isinstance(record, dict) and isinstance(record.get("evidence_id"), str)]
          if len(evidence_ids) != len(records):
              raise SystemExit("REA evidence bundle contains a record without a stable evidence_id.")
          request = {"inventory_evidence": [{"kind": "retained-evidence", "evidence_id": evidence_id} for evidence_id in evidence_ids]}
          request_path = pathlib.Path(sys.argv[2])
          request_path.write_text(json.dumps(request, separators=(",", ":")), encoding="utf-8")
          if request_path.stat().st_size > 16384:
              raise SystemExit("Graph request unexpectedly exceeds 16 KiB; refusing inline expansion.")
          print(f"Prepared graph request with {len(evidence_ids)} evidence IDs ({request_path.stat().st_size} bytes).")
          PY
              # Resolve Evidence IDs from the local bundle; never inline multi-megabyte Evidence records.
              rea project-android-application-graph "$REPORT_DIR/android-graph-request.json" \
                --evidence-bundle "$REPORT_DIR/merged-android-inventory-evidence.json" \
                --format json --full-output \
                > "$REPORT_DIR/android-application-graph.json" 2> "$REPORT_DIR/android-application-graph.stderr"
              graph_status="$?"
              printf '%s\n' "$graph_status" > "$REPORT_DIR/android-application-graph.exit-code.txt"
              if [[ "$graph_status" -ne 0 || ! -s "$REPORT_DIR/android-application-graph.json" ]]; then
                echo "REA Android application graph projection failed (exit $graph_status)." >&2
                cat "$REPORT_DIR/android-application-graph.stderr" >&2 || true
                exit 1
              fi
              python3 - "$REPORT_DIR/android-application-graph.json" <<'PY'
          import json, pathlib, sys
          path = pathlib.Path(sys.argv[1])
          value = json.loads(path.read_text(encoding="utf-8"))
          if not isinstance(value, (dict, list)) or not value:
              raise SystemExit("REA Android application graph output is empty or has an unexpected JSON shape.")
          print(f"Validated Android application graph JSON ({path.stat().st_size} bytes).")
          PY
            fi
          else
            echo "config.arm64_v8a.apk was not present in the XAPK." > "$REPORT_DIR/merged-abi-analysis.note.txt"
          fi

          # Full Apktool decode is kept outside REPORT_DIR until the workspace filters secrets and binaries.
          apktool_out="${RUNNER_TEMP}/rea-android/apktool-decoded"
          rm -rf "$apktool_out"
          apktool d -f -o "$apktool_out" "$APK_PATH" \
            > "$REPORT_DIR/apktool-decode.log" 2>&1
          printf '%s\n' "$?" > "$REPORT_DIR/apktool-decode.exit-code.txt"
          exit 0

      - name: Inventory Flutter assets and native libraries
        if: ${{ success() }}
        shell: bash
        env:
          REPORT_DIR: ${{ steps.reports.outputs.directory }}
        run: |
          set -euo pipefail
          android_dir="${RUNNER_TEMP}/rea-android"
          split_dir="$android_dir/split-content"
          mkdir -p "$split_dir"
          while IFS= read -r apk; do
            [[ -f "$apk" ]] || continue
            destination="$split_dir/$(basename "$apk" .apk)"
            mkdir -p "$destination"
            unzip -qq "$apk" 'lib/*' 'assets/flutter_assets/*' 'assets/flutter_assets/.env' -d "$destination" || true
          done < "$REPORT_DIR/extracted-apk-files.txt"

          find "$split_dir" -type f -name '*.so' -printf '%P\t%s bytes\n' | sort \
            > "$REPORT_DIR/native-libraries.txt"
          find "$split_dir" -type f -name '*.so' -print0 | sort -z | xargs -0 -r sha256sum \
            > "$REPORT_DIR/native-libraries.sha256"
          find "$split_dir" -type f -path '*/assets/flutter_assets/*' -printf '%P\n' | sort \
            > "$REPORT_DIR/flutter-assets.txt"

          notices_file="$(find "$split_dir" -type f -path '*/assets/flutter_assets/NOTICES.Z' -print -quit)"
          if [[ -n "$notices_file" ]]; then
            python3 - "$notices_file" "$REPORT_DIR/flutter-dependencies.txt" <<'PY'
          import gzip, pathlib, sys
          raw = gzip.open(sys.argv[1], "rb").read().decode("utf-8", "replace")
          names = []
          for block in raw.split("-" * 80):
              for line in block.strip().splitlines():
                  line = line.strip()
                  if not line:
                      break
                  if line and len(line) < 180:
                      names.append(line)
          unique = list(dict.fromkeys(names))
          pathlib.Path(sys.argv[2]).write_text(
              f"Packages named in Flutter NOTICES.Z: {len(unique)}\n" +
              "\n".join(unique) + "\n", encoding="utf-8")
          PY
          fi

          : > "$REPORT_DIR/native-url-candidates.txt"
          : > "$REPORT_DIR/libapp-interesting-strings.txt"
          while IFS= read -r lib; do
            strings -a "$lib" | grep -Eo 'https?://[^[:space:]"<>]+' \
              | sed -E 's/[),.;]+$//' >> "$REPORT_DIR/native-url-candidates.txt" || true
            strings -a "$lib" | grep -Ei 'yaya|api|graphql|oauth|socket|firebase|revenuecat|onesignal|appsflyer' \
              | head -n 5000 >> "$REPORT_DIR/libapp-interesting-strings.txt" || true
          done < <(find "$split_dir" -type f -name 'libapp.so' | sort)
          sort -u "$REPORT_DIR/native-url-candidates.txt" -o "$REPORT_DIR/native-url-candidates.txt"

          mkdir -p "$REPORT_DIR/flutter-config"
          while IFS= read -r config; do
            relative="${config#"$split_dir"/}"
            if [[ "$relative" == */.env ]]; then
              sed -E 's/^([[:space:]]*#?[[:space:]]*[A-Za-z_][A-Za-z0-9_]*)=.*/\1=[REDACTED]/' "$config" \
                >> "$REPORT_DIR/flutter-env-keys-redacted.txt"
              continue
            fi
            destination="$REPORT_DIR/flutter-config/$relative"
            mkdir -p "$(dirname "$destination")"
            cp "$config" "$destination"
          done < <(find "$split_dir" -type f \
            \( -name '.env' -o -name 'app_config.json' -o -name 'countries.json' \
               -o -name 'NativeAssetsManifest.json' -o -name 'FontManifest.json' \) | sort)

      - name: Decompile Flutter Dart AOT with Jadart
        if: ${{ success() }}
        shell: bash
        env:
          REPORT_DIR: ${{ steps.reports.outputs.directory }}
        run: |
          set +e
          input_dir="${RUNNER_TEMP}/rea-android/split-content/config.arm64_v8a/lib/arm64-v8a"
          jadart_dir="${RUNNER_TEMP}/jadart"
          venv="${RUNNER_TEMP}/jadart-venv"
          export_dir="${RUNNER_TEMP}/jadart-export"
          log_file="${RUNNER_TEMP}/jadart.log"
          status=0
          verify_status=99
          export_status=99

          sudo apt-get update -qq > "$RUNNER_TEMP/jadart-apt.log" 2>&1
          status=$?
          if [[ "$status" -eq 0 ]]; then
            sudo apt-get install -y --no-install-recommends python3-venv >> "$RUNNER_TEMP/jadart-apt.log" 2>&1
            status=$?
          fi
          if [[ "$status" -eq 0 ]]; then
            git clone --depth 1 https://github.com/IR0NBYTE/Jadart.git "$jadart_dir" > "$log_file" 2>&1
            status=$?
          fi
          status=$?
          if [[ "$status" -eq 0 ]]; then
            git -C "$jadart_dir" rev-parse HEAD > "$REPORT_DIR/jadart-source-revision.txt"
            python3 -m venv "$venv" >> "$log_file" 2>&1
            status=$?
          fi
          if [[ "$status" -eq 0 ]]; then
            "$venv/bin/pip" install --disable-pip-version-check "$jadart_dir/framework[disasm]" >> "$log_file" 2>&1
            status=$?
          fi
          if [[ "$status" -eq 0 ]]; then
            "$venv/bin/jadart" -j info "$input_dir/libapp.so" \
              > "$REPORT_DIR/jadart-info.json" 2> "$REPORT_DIR/jadart-info.stderr"
            status=$?
          fi
          if [[ "$status" -eq 0 ]]; then
            "$venv/bin/jadart" -j verify "$input_dir/libapp.so" \
              > "$REPORT_DIR/jadart-verify.json" 2> "$REPORT_DIR/jadart-verify.stderr"
            verify_status=$?
            "$venv/bin/jadart" -j export "$input_dir/libapp.so" \
              -o "$export_dir" -t 3 -a -q \
              > "$REPORT_DIR/jadart-export.json" 2> "$REPORT_DIR/jadart-export.stderr"
            export_status=$?
          fi

          printf '%s\n' "$status" > "$REPORT_DIR/jadart-exit-code.txt"
          printf '%s\n' "$verify_status" > "$REPORT_DIR/jadart-verify-exit-code.txt"
          printf '%s\n' "$export_status" > "$REPORT_DIR/jadart-export-exit-code.txt"
          if [[ "$status" -ne 0 ]]; then
            {
              echo "Jadart could not parse the Flutter snapshot (exit $status)."
              tail -n 60 "$log_file" 2>/dev/null
            } > "$REPORT_DIR/jadart-error.txt"
          fi

          python3 - "$REPORT_DIR" "$export_dir" "$jadart_dir" <<'PY'
          import json, pathlib, re, sys
          report, out, source = map(pathlib.Path, sys.argv[1:])
          lines = ["Jadart Flutter Dart AOT analysis"]
          def load(name):
              p = report / name
              if not p.exists():
                  return None
              try:
                  return json.loads(p.read_text(errors="replace"))
              except Exception:
                  return None
          info = load("jadart-info.json")
          if info and info.get("ok"):
              for key, snap in info.get("snapshots", {}).items():
                  lines += [
                      f"Snapshot: {key}",
                      f"  Dart: {snap.get('dart')}",
                      f"  Epoch: {snap.get('epoch')}",
                      f"  Target: {snap.get('target')}",
                      f"  Version hash: {snap.get('version_hash')}",
                      f"  Objects: {snap.get('objects')}",
                      f"  Clusters: {snap.get('clusters')}",
                      f"  Instruction table length: {snap.get('instr_table_len')}",
                  ]
          else:
              lines.append("Jadart info did not produce a supported snapshot header.")
          verify = load("jadart-verify.json")
          if verify:
              lines += ["", "Acceptance gates:"]
              for gate in verify.get("gates", []):
                  gate_status = gate.get("status") or ("PASS" if gate.get("passed") else "FAIL")
                  lines.append(f"  {gate.get('gate')}: {gate_status}")
              lines.append(f"  passed: {verify.get('passed')}; failed: {len(verify.get('failed', []))}")
          exported = load("jadart-export.json")
          if exported and exported.get("ok"):
              lines += [
                  "",
                  "Export summary:",
                  f"  libraries: {exported.get('libraries')}",
                  f"  classes: {exported.get('classes')}",
                  f"  methods: {exported.get('methods')}",
                  f"  strings: {exported.get('strings')}",
                  f"  selectors: {exported.get('selectors')}",
              ]
          if out.exists():
              dart_files = list((out / "sources").rglob("*.dart")) if (out / "sources").exists() else []
              lines.append(f"  Dart source files generated: {len(dart_files)}")
              class_names, method_names = set(), set()
              class_re = re.compile(r"(?m)^\s*(?:abstract\s+|sealed\s+)?(?:class|mixin|enum|extension)\s+([A-Za-z_$][A-Za-z0-9_$]*)")
              method_re = re.compile(r"(?m)^\s{2,}(?:static\s+)?(?:[A-Za-z_$][A-Za-z0-9_$<>?,.\[\] ]*\s+)?([A-Za-z_$][A-Za-z0-9_$]*)\s*\(")
              keywords = re.compile(r"auth|login|profile|helper|nann|job|chat|message|payment|premium|subscr|visa|interview|booking|search|filter|video|document|upload|firebase|api|socket|notification|family|care", re.I)
              for p in dart_files:
                  txt = p.read_text(errors="replace")
                  class_names.update(class_re.findall(txt))
                  for m in method_re.finditer(txt):
                      name = m.group(1)
                      if keywords.search(name):
                          method_names.add(name)
              lines += ["", f"Recovered Dart classes: {len(class_names)}",
                        f"Feature-related method names: {len(method_names)}",
                        "Feature-related method candidates:"]
              lines += [f"  - {n}" for n in sorted(method_names)[:500]]
              if len(method_names) > 500:
                  lines.append(f"  ... {len(method_names)-500} additional candidates omitted")

              strings_file = out / "strings.txt"
              if strings_file.exists():
                  pool = strings_file.read_text(errors="replace").splitlines()
                  feature_re = re.compile(r"yaya|helper|nann|family|care|visa|interview|concierge|job|chat|message|profile|premium|subscr|booking|document|upload|cv|passport|certificate|reference|identity|login|register|otp|password|phone|payment|paywall|firebase|onesignal|socket|api|graphql|endpoint|http|gemini|\bAI\b", re.I)
                  feature_strings = sorted({s for s in pool if feature_re.search(s) and len(s) <= 300})
                  (report / "jadart-feature-strings.txt").write_text(
                      "\n".join(feature_strings[:600]) + "\n", encoding="utf-8")
                  lines += ["", f"Feature-related string literals: {len(feature_strings)}",
                            "String inventory: jadart-feature-strings.txt"]

              markers = [
                  "ApiEndpoints", "loadAppConfigData", "AppConfigLoader",
                  "YayaAiController", "FamilyOnboardingController", "SocketService",
                  "RevenueCat", "Top Yaya Picks", "Yaya Chat", "INTERVIEW_BOOKING_ENABLED",
                  "api_server_url", "chat_server_url", "FIREBASE_APP_CONFIG_URL",
                  "FirebaseAuth", "carefinder", "concierge",
              ]
              source_hits = []
              for source_file in dart_files:
                  try:
                      source_lines = source_file.read_text(errors="replace").splitlines()
                  except OSError:
                      continue
                  for marker in markers:
                      for index, source_line in enumerate(source_lines):
                          if marker.lower() not in source_line.lower():
                              continue
                          class_context = ""
                          method_context = ""
                          for previous in reversed(source_lines[:index]):
                              stripped = previous.strip()
                              if not class_context and (stripped.startswith("class ") or stripped.startswith("abstract class ")):
                                  class_context = stripped[:160]
                              if not method_context and "(" in stripped and stripped.endswith("{") and not stripped.startswith(("if ", "for ", "while ", "switch ", "catch ")):
                                  method_context = stripped[:160]
                              if class_context and method_context:
                                  break
                          source_hits.append(
                              f"{source_file.relative_to(out)}:{index+1} [{marker}] "
                              f"class={class_context or '?'} method={method_context or '?'}"
                          )
                          if len(source_hits) >= 400:
                              break
                      if len(source_hits) >= 400:
                          break
                  if len(source_hits) >= 400:
                      break
              (report / "jadart-source-index.txt").write_text(
                  "\n".join(source_hits) + ("\n" if source_hits else "No selected marker occurrences found.\n"),
                  encoding="utf-8")
              lines += ["", f"Source-index matches: {len(source_hits)}",
                        "Source index: jadart-source-index.txt"]
          lines.append("")
          (report / "jadart-summary.txt").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          exit 0

      - name: Assemble editor-ready recovered workspace
        if: ${{ success() }}
        shell: bash
        env:
          REPORT_DIR: ${{ steps.reports.outputs.directory }}
        run: |
          set -euo pipefail
          python3 - "$REPORT_DIR" "${RUNNER_TEMP}/jadart-export" "${RUNNER_TEMP}/rea-android/split-content" "${RUNNER_TEMP}/rea-android/apktool-decoded" <<'PY'
