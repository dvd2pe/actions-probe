              "FamilyPlansPricing", "FamilySubscriptionStatus", "FamilyTrialStarted",
              "HelperOnboarding", "HelpersSearch", "EmployerMessages", "FamilyWelcome",
          ]
          marker_hits = collections.defaultdict(list)
