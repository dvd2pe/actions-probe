                      locations.append(f"lib/recovered/{item['file']}:{item['line']} ({classes})")
                  source_cell = "<br>".join(locations)
              else:
                  source_cell = "_String recovered; source location not mapped_"
              route_rows.append(f"| {route} | {source_cell} |")
          (root / "docs/route-source-map.md").write_text(
              "# Route-to-Dart source evidence map\n\n"
