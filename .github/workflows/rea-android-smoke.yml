          feature_file = report / "jadart-feature-strings.txt"
          feature_lines = feature_file.read_text(errors="replace").splitlines() if feature_file.is_file() else []
          route_pattern = re.compile(r"(?<![A-Za-z0-9_])/(?!/)[A-Za-z0-9_{}~.-]+(?:/[A-Za-z0-9_{}~.-]+)*")
          route_sources = collections.defaultdict(list)
          route_literal_pattern = re.compile(
              r"""(?P<quote>['"])(?P<route>/(?!/)[A-Za-z][A-Za-z0-9_{}~.-]*(?:/[A-Za-z0-9_{}~.-]+)*)(?P=quote)"""
          )
          class_pattern = re.compile(r"(?m)^class\s+([A-Za-z_][A-Za-z0-9_]*)")
          route_candidates = {
              match.group(0).rstrip(".,;")
              for line in feature_lines
              for match in route_pattern.finditer(line)
          }
          for dart_file in dart_files:
              source_text = dart_file.read_text(errors="replace")
              source_classes = class_pattern.findall(source_text)
              for match in route_literal_pattern.finditer(source_text):
                  route = match.group("route")
                  line_number = source_text.count("\n", 0, match.start()) + 1
                  route_sources[route].append({
                      "file": dart_file.relative_to(source_dir).as_posix(),
                      "line": line_number,
                      "classes": source_classes[:8],
