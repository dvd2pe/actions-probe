          )
          if not asset_roots:
              raise SystemExit("No extracted Flutter asset directory was found.")

          primary = next(
              (p for p in asset_roots if p.parents[1].name == "com.yaya.portal"),
              next((p for p in asset_roots if (p / "AssetManifest.bin").is_file()), asset_roots[0]),
          )

          def copy_assets(source, destination):
              copied = 0
              for item in sorted(source.rglob("*")):
                  if not item.is_file() or item.name.lower() == ".env":
                      continue
                  relative = item.relative_to(source)
                  target = destination / relative
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(item, target)
                  copied += 1
              return copied

          primary_asset_count = copy_assets(primary, root / "assets/flutter_assets")
          split_asset_count = 0
