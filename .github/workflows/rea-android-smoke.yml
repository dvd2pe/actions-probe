          if apktool_dir.is_dir():
              decoded_count = 0
              for item in sorted(apktool_dir.rglob("*")):
                  if not item.is_file() or item.name.lower() == ".env":
                      continue
                  relative = item.relative_to(apktool_dir)
                  if relative.parts[:2] == ("assets", "flutter_assets"):
                      continue
                  if relative.parts and relative.parts[0] == "lib" and item.suffix.lower() == ".so":
