              + "\n\n"
              + f"Generated Dart plugin registrant package imports: {len(plugin_imports)}.\n\n"
              + "The complete 396-name NOTICES.Z package inventory is in dependencies.md. "
              "Exact versions and original direct-vs-transitive constraints remain unknown.\n",
              encoding="utf-8",
          )

          (root / "docs/android-layer.md").write_text(
              "# Android packaging and resource layer\n\n"
              f"- Apktool-decoded files copied: {decoded_count}\n"
              f"- Smali files recovered: {sum(1 for p in (root / 'android/apktool').rglob('*.smali'))}\n"
              f"- Flutter plugin registrations recovered: {len(plugin_registry)}\n"
              "- The base APK's AndroidManifest.xml, resource XML, and Smali output are under android/apktool/.\n"
              "- Flutter assets are kept separately under assets/flutter_assets/ to avoid duplicate copies.\n"
              "- Raw native .so files and .env are excluded from the public workspace; native library names and hashes remain in forensics/.\n"
              "- JNI evidence from the synthetic base-plus-arm64 analysis APK is retained in forensics/android-jni-bindings-merged.json. "
              "That merged APK is an analysis-only container, not an installable or signed release.\n",
              encoding="utf-8",
          )

          import xml.etree.ElementTree as ET
          manifest_path = root / "android/apktool/AndroidManifest.xml"
          if manifest_path.is_file():
              manifest_root = ET.parse(manifest_path).getroot()
              android_attr = "{http://schemas.android.com/apk/res/android}"
              app_node = manifest_root.find("application")
              permissions = sorted({
                  node.get(android_attr + "name", "")
                  for node in manifest_root
                  if node.tag.endswith("uses-permission") and node.get(android_attr + "name")
              })
              components = []
              if app_node is not None:
                  for node in app_node:
                      if node.tag not in {"activity", "activity-alias", "service", "receiver", "provider"}:
                          continue
                      name = node.get(android_attr + "name", "")
                      exported = node.get(android_attr + "exported", "unspecified")
                      filters = []
                      for intent_filter in node.findall("intent-filter"):
                          actions = [x.get(android_attr + "name", "") for x in intent_filter.findall("action")]
                          categories = [x.get(android_attr + "name", "") for x in intent_filter.findall("category")]
                          data_values = []
                          for data_node in intent_filter.findall("data"):
                              attrs = ("scheme", "host", "port", "path", "pathPrefix", "pathPattern", "mimeType")
                              data_values.extend(
                                  f"{key}={data_node.get(android_attr + key)}"
                                  for key in attrs if data_node.get(android_attr + key)
                              )
                          filters.append("; ".join(
                              part for part in (
                                  "actions=" + ",".join(actions) if actions else "",
                                  "categories=" + ",".join(categories) if categories else "",
                                  "data=" + ",".join(data_values) if data_values else "",
                              ) if part
                          ))
                      components.append((node.tag, name, exported, filters))
              sdk_node = manifest_root.find("uses-sdk")
              sdk_summary = []
              if sdk_node is not None:
                  for key in ("minSdkVersion", "targetSdkVersion", "maxSdkVersion"):
                      value = sdk_node.get(android_attr + key)
                      if value:
                          sdk_summary.append(f"- {key}: {value}")
              component_rows = []
              for kind, name, exported, filters in components:
                  component_rows.append(
                      f"| {kind} | {name} | {exported} | "
                      + ("<br>".join(filters) if filters else "—")
                      + " |"
                  )
              (root / "docs/android-manifest-map.md").write_text(
                  "# Android manifest reconstruction map\n\n"
                  f"- Package: {manifest_root.get('package', 'unknown')}\n"
                  f"- Version name: {manifest_root.get(android_attr + 'versionName', 'not declared')}\n"
                  f"- Version code: {manifest_root.get(android_attr + 'versionCode', 'not declared')}\n"
                  + ("\n".join(sdk_summary) + "\n" if sdk_summary else "")
                  + f"- Application class: {app_node.get(android_attr + 'name', 'default') if app_node is not None else 'not found'}\n"
                  + f"- Application label: {app_node.get(android_attr + 'label', 'not declared') if app_node is not None else 'not found'}\n"
                  + f"- Declared permissions: {len(permissions)}\n\n"
                  + "## Permissions\n\n"
                  + ("\n".join(f"- {item}" for item in permissions) if permissions else "_None recovered._")
                  + "\n\n## Android components\n\n"
                  + "| Type | Name | Exported | Intent filters |\n|---|---|---|---|\n"
                  + ("\n".join(component_rows) if component_rows else "| _None recovered_ | — | — | — |")
                  + "\n\nAPI keys and credential-like manifest values are intentionally not copied into this summary.\n",
                  encoding="utf-8",
              )

          asset_files = sorted(p for p in (root / "assets").rglob("*") if p.is_file())
          extension_counts = collections.Counter(p.suffix.lower() or "[no extension]" for p in asset_files)
          asset_rows = "\n".join(f"- {ext}: {count}" for ext, count in sorted(extension_counts.items()))
          (root / "docs/asset-inventory.md").write_text(
              "# Extracted Flutter assets\n\n"
              f"- Primary Flutter asset files: {primary_asset_count}\n"
              f"- Additional split asset files: {split_asset_count}\n"
              f"- Total files in workspace assets/: {len(asset_files)}\n"
              "- .env was deliberately excluded; only redacted environment-variable names are retained.\n\n"
              "## File types\n\n" + asset_rows + "\n\n"
              "The original Flutter asset directory is under assets/flutter_assets/. "
              "Additional split-specific assets are preserved under assets/split-assets/.\n",
              encoding="utf-8",
          )

          dependency_file = report / "flutter-dependencies.txt"
          dependency_text = dependency_file.read_text(errors="replace") if dependency_file.is_file() else "Dependency inventory unavailable.\n"
          (root / "docs/dependencies.md").write_text(
              "# Flutter dependency inventory\n\n"
              "Package names were extracted from NOTICES.Z. This does not reliably recover exact versions, "
              "direct-vs-transitive status, or the original pubspec.lock; no guessed versions are inserted.\n\n"
              "~~~text\n" + dependency_text.rstrip() + "\n~~~\n",
              encoding="utf-8",
          )

          metadata = {}
          for name in ("jadart-info.json", "jadart-export.json"):
              path = report / name
              if path.is_file():
                  try:
                      metadata[name] = json.loads(path.read_text(errors="replace"))
                  except Exception:
                      metadata[name] = {"parse_error": True}
          export_meta = metadata.get("jadart-export.json", {})
          (root / "docs/recovery-manifest.json").write_text(
              json.dumps(
                  {
                      "package": "com.yaya.portal",
                      "app_version": "5.6.2",
                      "version_code": 228,
                      "source_bundle": "XAPK",
                      "dart_source_files": len(dart_files),
                      "jadart_export_file_count": len(export_meta.get("files", [])),
                      "generated_plugin_registrant_included": plugin_registrant_included,
                      "direct_package_import_count": len(direct_dependencies),
                      "plugin_package_import_count": len(plugin_imports),
                      "native_plugin_count": len(plugin_registry),
                      "apktool_decoded_file_count": decoded_count,
                      "asset_files": len(asset_files),
                      "native_library_count": native_count,
                      "jadart_libraries": export_meta.get("libraries"),
                      "jadart_classes": export_meta.get("classes"),
                      "jadart_methods": export_meta.get("methods"),
                      "jadart_strings": export_meta.get("strings"),
                      "dart_snapshot": metadata.get("jadart-info.json", {}).get("snapshots", {}),
                      "raw_native_libraries_included": False,
                      "environment_file_included": False,
                  },
                  indent=2,
                  ensure_ascii=False,
              ) + "\n",
              encoding="utf-8",
          )

          secret_key = re.compile(
              r"(api[_-]?key|access[_-]?token|refresh[_-]?token|client[_-]?secret|password|secret|credential|authorization|private[_-]?key)",
              re.I,
          )

          def scrub(value):
              if isinstance(value, dict):
                  result = {}
                  for key, child in value.items():
                      result[key] = "[REDACTED]" if secret_key.search(str(key)) else scrub(child)
                  return result
              if isinstance(value, list):
                  return [scrub(child) for child in value]
              return value

          for json_path in sorted(root.rglob("*.json")):
              try:
                  parsed = json.loads(json_path.read_text(encoding="utf-8"))
              except Exception:
                  continue
              json_path.write_text(
                  json.dumps(scrub(parsed), indent=2, ensure_ascii=False) + "\n",
                  encoding="utf-8",
              )

          (root / ".gitignore").write_text(
              ".dart_tool/\nbuild/\n.gradle/\nlocal.properties\n"
              "*.jks\n*.keystore\n*.p12\n*.pfx\n.env\n.env.*\n",
              encoding="utf-8",
          )
          (root / ".vscode/extensions.json").write_text(
              json.dumps(
                  {"recommendations": ["Dart-Code.dart-code", "Dart-Code.flutter"]},
                  indent=2,
              ) + "\n",
              encoding="utf-8",
          )
          (root / "README.md").write_text(
              "# Yaya — recovered Flutter workspace\n\n"
              "This workspace was generated from the Android XAPK for com.yaya.portal "
              "(version 5.6.2, versionCode 228) using REA and Jadart.\n\n"
              "## Work directly on GitHub\n\n"
              "No local clone is required. Browse and edit this branch in the GitHub web interface, or open "
              "the branch in github.dev: https://github.dev/dvd2pe/actions-probe/tree/yaya-recovered-source. "
              "GitHub Actions performs extraction and verification in the cloud. The recovered Dart files "
              "are in lib/recovered/; Flutter assets are in assets/flutter_assets/ and assets/split-assets/; "
              "analysis evidence is in forensics/; navigation, route-to-source, feature-to-source and Android "
              "manifest maps are in docs/. The decoded Android resource XML and Smali are in android/apktool/.\n\n"
              "The Android plugin registry is documented in docs/plugin-registry.md, with its Smali implementation under android/apktool/smali_classes3/io/flutter/plugins/GeneratedPluginRegistrant.smali. Direct package candidates are in docs/direct-dependency-candidates.md.\n\n"
              "## Important status\n\n"
              "- lib/recovered/ contains generated decompilation output, not the original Dart repository.\n"
              "- Dart identifiers and file names may be obfuscated; these files are preserved as raw evidence.\n"
              "- This is an editor-ready recovery workspace, not yet a buildable Flutter application. "
              "The original pubspec.yaml, exact dependency versions, Android project scaffolding, "
              "and signing key have not been recovered.\n"
              "- .env and raw native .so binaries are intentionally excluded from this public branch. "
              "Their redacted key inventory, hashes, and string-analysis reports are retained where safe.\n"
              "- Credential-like values in text/JSON reports are redacted before publication.\n\n"
              "## Next reconstruction pass\n\n"
              "Map important recovered classes to screens and controllers, recover the Android resource "
              "tree and plugin configuration, infer dependency versions, then refactor selected flows into "
              "clean, buildable Flutter code. Keep lib/recovered/ unchanged as the reference layer.\n",
              encoding="utf-8",
          )

          print(
              json.dumps(
                  {
                      "workspace": str(root),
                      "dart_source_files": len(dart_files),
                      "primary_asset_files": primary_asset_count,
                      "additional_split_asset_files": split_asset_count,
                      "native_libraries_indexed": native_count,
                      "route_candidates": len(routes),
                  },
                  indent=2,
              )
          )
          PY

      - name: Redact credentials and API keys from public report
        if: ${{ always() && steps.reports.outputs.directory != '' }}
        shell: bash
        env:
          REPORT_DIR: ${{ steps.reports.outputs.directory }}
        run: |
          python3 - "$REPORT_DIR" <<'PY'
          import pathlib, re, sys
          root = pathlib.Path(sys.argv[1])
          patterns = [
              re.compile(r"AIza[0-9A-Za-z_-]{35}"),
              re.compile(r"AKIA[0-9A-Z]{16}"),
              re.compile(r"(?i)(Bearer\s+)[A-Za-z0-9._~+/=-]+"),
              re.compile(r"eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}"),
              re.compile(r"(?i)([?&](?:api[_-]?key|token|access_token|refresh_token|client_secret|password|secret)=)[^&\s\"']+"),
              re.compile(r"(?i)(\b(?:api[_-]?key|client_secret|access_token|refresh_token|password|secret|token)\s*[:=]\s*[\"']?)[A-Za-z0-9_./+=-]{8,}"),
          ]
          summary = []
          for path in root.rglob("*"):
              if not path.is_file() or path.name == "redaction-summary.txt":
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              total = 0
              for pattern in patterns:
                  text, count = pattern.subn(lambda m: (m.group(1) if m.lastindex else "") + "[REDACTED]", text)
                  total += count
              if total:
                  path.write_text(text, encoding="utf-8")
                  summary.append(f"{path.relative_to(root)}: {total} value(s) redacted")
          (root / "redaction-summary.txt").write_text(
              "\n".join(summary) + ("\n" if summary else "No credential-like values matched the redaction rules.\n"),
              encoding="utf-8"
          )
          PY

      - name: Attach final redaction summary to workspace
        if: ${{ always() && steps.reports.outputs.directory != '' }}
        shell: bash
        env:
          REPORT_DIR: ${{ steps.reports.outputs.directory }}
        run: |
          if [[ -f "$REPORT_DIR/redaction-summary.txt" && -d "$REPORT_DIR/yaya-reconstructed/forensics" ]]; then
            cp "$REPORT_DIR/redaction-summary.txt" "$REPORT_DIR/yaya-reconstructed/forensics/redaction-summary.txt"
          fi

      - name: Upload recovered Dart source and Flutter assets
        if: ${{ success() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yaya-recovered-workspace
          path: ${{ steps.reports.outputs.directory }}/yaya-reconstructed
          if-no-files-found: error
          retention-days: 30

      - name: Upload analysis report
        if: ${{ always() && steps.reports.outputs.directory != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rea-android-analysis
          path: ${{ steps.reports.outputs.directory }}
          if-no-files-found: warn
          retention-days: 7
  publish-recovered-workspace:
    name: Publish recovered workspace branch
    needs: android-analysis
    if: ${{ needs.android-analysis.result == 'success' && github.event_name != 'pull_request' && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/rea-yaya-blutter-deep-analysis') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download recovered workspace artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v4.3.0
        with:
          name: yaya-recovered-workspace
          path: ${{ runner.temp }}/yaya-recovered-workspace

      - name: Checkout analysis branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          path: publisher
          persist-credentials: true

      - name: Publish clean editor workspace to dedicated branch
        working-directory: publisher
        env:
          SOURCE_DIR: ${{ runner.temp }}/yaya-recovered-workspace
        shell: bash
        run: |
          set -euo pipefail
          test -d "$SOURCE_DIR/lib/recovered"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin yaya-recovered-source >/dev/null 2>&1; then
            git fetch origin yaya-recovered-source
            git switch --create yaya-recovered-source --track origin/yaya-recovered-source
            git rm -rf . --ignore-unmatch
            git clean -fdx
          else
            git switch --orphan yaya-recovered-source
            git rm -rf . --ignore-unmatch || true
            git clean -fdx
          fi

          cp -a "$SOURCE_DIR"/. .
          git add -A
          if git diff --cached --quiet; then
            echo "Recovered workspace is unchanged; no commit required."
            exit 0
          fi
          git commit -m "Publish recovered Yaya Flutter workspace"
          git push origin yaya-recovered-source