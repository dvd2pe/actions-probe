              "Files in recovered/ were generated from the Flutter AOT snapshot by Jadart. "
              "They are decompiled output, not the original authoring repository. "
              "Identifiers and file names may be obfuscated; treat this directory as immutable evidence "
              "and build cleaned code in sibling folders when reconstructing features.\n",
              encoding="utf-8",
          )

          if (export / "strings.txt").is_file():
              shutil.copy2(export / "strings.txt", root / "forensics/jadart-strings.txt")

          if plugin_registrant_included:
              shutil.copy2(plugin_registrant, root / "forensics/dart_plugin_registrant.dart")

          report_files = (
              "app-source.txt",
              "apk-bundle.sha256",
              "extracted-apk-files.txt",
              "extracted-apk-sha256.txt",
              "native-libraries.txt",
              "native-libraries.sha256",
              "flutter-assets.txt",
              "flutter-dependencies.txt",
              "flutter-env-keys-redacted.txt",
              "libapp-interesting-strings.txt",
              "native-url-candidates.txt",
              "jadart-info.json",
              "jadart-verify.json",
              "jadart-export.json",
              "jadart-summary.txt",
              "jadart-source-index.txt",
              "jadart-feature-strings.txt",
              "jadart-source-revision.txt",
              "rea-version.json",
              "rea-cli-help.txt",
              "rea-schema-project-android-application-graph.json",
              "rea-schema-build-reconstruction-obligation-ledger.json",
              "rea-schema-trace-application-feature.json",
              "rea-schema-project-android-application-graph.stderr",
              "rea-schema-build-reconstruction-obligation-ledger.stderr",
              "rea-schema-trace-application-feature.stderr",
              "rea-schema-project-android-application-graph.exit-code.txt",
              "rea-schema-build-reconstruction-obligation-ledger.exit-code.txt",
              "rea-schema-trace-application-feature.exit-code.txt",
              "android-resources.json",
              "android-jni-bindings.json",
              "flutter-build-identity.json",
              "signature.json",
              "analysis.json",
              "apktool-version.txt",
              "apktool-command.txt",
              "apktool-decode.log",
              "apktool-decode.exit-code.txt",
              "merged-abi-analysis.sha256",
              "merged-abi-analysis.note.txt",
              "android-jni-bindings-merged.json",
              "android-jni-bindings-merged.stderr",
              "android-jni-bindings-merged.exit-code.txt",
              "flutter-build-identity-merged.json",
              "flutter-build-identity-merged.stderr",
              "flutter-build-identity-merged.exit-code.txt",
              "merged-android-inventory-evidence.json",
              "merged-android-inventory-summary.json",
              "merged-android-inventory.stderr",
              "merged-android-inventory.exit-code.txt",
              "android-graph-request.json",
              "android-application-graph.json",
              "android-application-graph.stderr",
              "android-application-graph.exit-code.txt",
              "redaction-summary.txt",
          )
          for name in report_files:
